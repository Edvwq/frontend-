<div class="card">
    <h1>Categoría</h1>

    <p-button (click)="mostrarDialog()" label="Nueva Categoría" />
    <p-dialog 
        header="Categoría" 
        [(visible)]="visible" 
        [modal]="true" 
        [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" 
        [style]="{ width: '50vw' }" 
        [draggable]="false" 
        [resizable]="false">
        
        <form [formGroup]="categoriaForm">
            <div class="p-fluid">
                <div class="field mb-3">
                    <label for="name" class="font-bold mb-2 block">Nombre</label>
                    <input type="text" pInputText id="name" required autofocus formControlName="nombre"/>
                    <small class="p-error block mt-1">El campo nombre es obligatorio.</small>
                </div>

                <div class="field mb-3">
                    <label for="det" class="font-bold mb-2 block">Detalle</label>
                    <input type="text" pInputText id="det" required formControlName="detalle"/>
                </div>
            </div>
        </form>

        <ng-template pTemplate="footer">
            <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="visible=false"></button>
            <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-text" (click)="guardarCategoria()"></button>
        </ng-template>
    </p-dialog>

    <p-table [value]="categorias" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>DETALLE</th>
                <th>ACCION</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-categoria>
            <tr>
                <td>{{ categoria.id}}</td>
                <td>{{ categoria.nombre}}</td>
                <td>{{ categoria.detalle}}</td>
                <td>
                    <div class="flex">
                        <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editarCategoria(categoria)"></button>
                        <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="eliminarCategoria(categoria)"></button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
